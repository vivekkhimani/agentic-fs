name: Labeler

# Auto-applies area labels to PRs based on the files they touch (.github/labeler.yml).
# pull_request_target so it also works for PRs opened from forks. The labeler action
# never checks out or runs PR code, so this is safe.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: true
